  </style>
  <rect width="480" height="360" rx="10" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <circle cx="20" cy="20" r="4.5" fill="#ff5f56"/>
  <circle cx="34" cy="20" r="4.5" fill="#ffbd2e"/>
  <circle cx="48" cy="20" r="4.5" fill="#27c93f"/>
  <text x="65" y="24" fill="#0969da" class="terminal-header">$ repo_footprint.sh</text>
  <text x="460" y="24" fill="#57606a" class="sub-header" text-anchor="end">Language Footprint</text>
  <line x1="0" y1="38" x2="480" y2="38" stroke="#e1e4e8" stroke-width="1"/>

  <!-- Radar Grid & Axes -->
  <polygon points="240.0,166.25 268.75,195.0 240.0,223.75 211.25,195.0" fill="none" stroke="#f6f8fa" stroke-width="1.5" /><polygon points="240.0,137.5 297.5,195.0 240.0,252.5 182.5,195.0" fill="none" stroke="#f6f8fa" stroke-width="1.5" /><polygon points="240.0,108.75 326.25,195.0 240.0,281.25 153.75,195.0" fill="none" stroke="#f6f8fa" stroke-width="1.5" /><polygon points="240.0,80.0 355.0,195.0 240.0,310.0 125.0,195.0" fill="none" stroke="#f6f8fa" stroke-width="1.5" />
  <line x1="240" y1="195" x2="240.0" y2="80.0" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3" /><line x1="240" y1="195" x2="355.0" y2="195.0" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3" /><line x1="240" y1="195" x2="240.0" y2="310.0" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3" /><line x1="240" y1="195" x2="125.0" y2="195.0" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3" />

  <!-- Data Polygon & Elements -->
  <polygon points="240.0,85.75 291.75,195.0 240.0,246.75 188.25,195.0" fill="rgba(5, 150, 105, 0.15)" stroke="#059669" stroke-width="2.5" stroke-linejoin="round" />
  <circle cx="240.0" cy="85.75" r="4" fill="#059669" stroke="#ffffff" stroke-width="1.5" /><circle cx="291.75" cy="195.0" r="4" fill="#059669" stroke="#ffffff" stroke-width="1.5" /><circle cx="240.0" cy="246.75" r="4" fill="#059669" stroke="#ffffff" stroke-width="1.5" /><circle cx="188.25" cy="195.0" r="4" fill="#059669" stroke="#ffffff" stroke-width="1.5" />
