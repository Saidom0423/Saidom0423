<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="480" height="140">
  <style>
    .terminal-header { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: 600; }
  </style>
  <rect width="480" height="140" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <circle cx="20" cy="20" r="4.5" fill="#ff5f56"/>
  <circle cx="34" cy="20" r="4.5" fill="#ffbd2e"/>
  <circle cx="48" cy="20" r="4.5" fill="#27c93f"/>
  <text x="65" y="24" fill="#58a6ff" class="terminal-header">$ cat repo_languages.json</text>
  <line x1="0" y1="38" x2="480" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Progress Bar -->
  <g clip-path="url(#bar-clip)">
    <clipPath id="bar-clip">
      <rect x="20" y="55" width="440" height="16" rx="8"/>
    </clipPath>
    <rect x="20" y="55" width="184.79999999999998" height="16" fill="#00B4AB" /><rect x="204.79999999999998" y="55" width="123.20000000000002" height="16" fill="#F7DF1E" /><rect x="328.0" y="55" width="79.2" height="16" fill="#3572A5" /><rect x="407.2" y="55" width="52.8" height="16" fill="#e34c26" />
  </g>

  <!-- Legend -->
  
    <circle cx="26" cy="102" r="5" fill="#00B4AB"/>
    <text x="36" y="106" fill="#c9d1d9" font-family="Fira Code, monospace" font-size="11">Dart / Flutter <tspan font-weight="bold">42%</tspan></text>
    
    <circle cx="146" cy="102" r="5" fill="#F7DF1E"/>
    <text x="156" y="106" fill="#c9d1d9" font-family="Fira Code, monospace" font-size="11">JavaScript / React <tspan font-weight="bold">28%</tspan></text>
    
    <circle cx="286" cy="102" r="5" fill="#3572A5"/>
    <text x="296" y="106" fill="#c9d1d9" font-family="Fira Code, monospace" font-size="11">Python / Django <tspan font-weight="bold">18%</tspan></text>
    
    <circle cx="396" cy="102" r="5" fill="#e34c26"/>
    <text x="406" y="106" fill="#c9d1d9" font-family="Fira Code, monospace" font-size="11">HTML / CSS <tspan font-weight="bold">12%</tspan></text>
    
</svg>