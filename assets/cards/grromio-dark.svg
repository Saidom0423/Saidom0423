<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="440" height="240">
  <style>
    .terminal-header { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: 600; }
    .card-title { font-family: 'Fira Code', monospace; font-size: 15px; font-weight: 700; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; line-height: 1.4; }
  </style>
  <rect width="440" height="240" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <circle cx="20" cy="20" r="4.5" fill="#ff5f56"/>
  <circle cx="34" cy="20" r="4.5" fill="#ffbd2e"/>
  <circle cx="48" cy="20" r="4.5" fill="#27c93f"/>
  <text x="65" y="24" fill="#58a6ff" class="terminal-header">$ ./grromio</text>
  
  <!-- Category Pill -->
  <rect x="290" y="10" width="130" height="20" rx="10" fill="rgba(56, 189, 248, 0.12)"/>
  <text x="355" y="24" fill="#38bdf8" font-family="Fira Code, monospace" font-size="10" font-weight="600" text-anchor="middle">Startup / Product</text>

  <line x1="0" y1="38" x2="440" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Project Name -->
  <text x="20" y="62" fill="#58a6ff" class="card-title">Grromio</text>

  <!-- Description -->
  <text fill="#c9d1d9" class="card-desc">
    <tspan x="20" y="86">Full-stack grooming service marketplace with</tspan><tspan x="20" y="104">modular DRF API backend, real-time scheduling,</tspan><tspan x="20" y="122">and production frontend deployment.</tspan>
  </text>

  <!-- Tech Stack Badges -->
  
    <rect x="20" y="148" width="49" height="22" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="44" y="163" fill="#34d399" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">React</text>
    
    <rect x="75" y="148" width="70" height="22" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="110" y="163" fill="#34d399" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">Tailwind</text>
    
    <rect x="151" y="148" width="56" height="22" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="179" y="163" fill="#34d399" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">Django</text>
    
    <rect x="213" y="148" width="35" height="22" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="230" y="163" fill="#34d399" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">DRF</text>
    
    <rect x="254" y="148" width="84" height="22" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="296" y="163" fill="#34d399" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">PostgreSQL</text>
    

  <line x1="20" y1="188" x2="420" y2="188" stroke="#30363d" stroke-width="1"/>

  <!-- Footer Info -->
  <text x="20" y="208" fill="#8b949e" font-family="Fira Code, monospace" font-size="11">🛠️ Python / React</text>
  <text x="420" y="208" fill="#10b981" font-family="Fira Code, monospace" font-size="11" text-anchor="end">⚡ Live Demo</text>
</svg>