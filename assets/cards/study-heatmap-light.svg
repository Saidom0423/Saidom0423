<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="440" height="240">
  <style>
    .terminal-header { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: 600; }
    .card-title { font-family: 'Fira Code', monospace; font-size: 15px; font-weight: 700; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; line-height: 1.4; }
  </style>
  <rect width="440" height="240" rx="10" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <circle cx="20" cy="20" r="4.5" fill="#ff5f56"/>
  <circle cx="34" cy="20" r="4.5" fill="#ffbd2e"/>
  <circle cx="48" cy="20" r="4.5" fill="#27c93f"/>
  <text x="65" y="24" fill="#0969da" class="terminal-header">$ ./study-heatmap</text>
  
  <!-- Category Pill -->
  <rect x="290" y="10" width="130" height="20" rx="10" fill="#ddf4ff"/>
  <text x="355" y="24" fill="#0969da" font-family="Fira Code, monospace" font-size="10" font-weight="600" text-anchor="middle">Mobile Productivity</text>

  <line x1="0" y1="38" x2="440" y2="38" stroke="#e1e4e8" stroke-width="1"/>

  <!-- Project Name -->
  <text x="20" y="62" fill="#0969da" class="card-title">Study Heatmap</text>

  <!-- Description -->
  <text fill="#24292e" class="card-desc">
    <tspan x="20" y="86">Flutter productivity app featuring interactive</tspan><tspan x="20" y="104">study heatmaps, cloud state synchronization,</tspan><tspan x="20" y="122">and Firestore / Supabase auth.</tspan>
  </text>

  <!-- Tech Stack Badges -->
  
    <rect x="20" y="148" width="63" height="22" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text x="51" y="163" fill="#059669" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">Flutter</text>
    
    <rect x="89" y="148" width="42" height="22" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text x="110" y="163" fill="#059669" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">Dart</text>
    
    <rect x="137" y="148" width="70" height="22" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text x="172" y="163" fill="#059669" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">Firebase</text>
    
    <rect x="213" y="148" width="77" height="22" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text x="251" y="163" fill="#059669" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">Firestore</text>
    
    <rect x="296" y="148" width="70" height="22" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text x="331" y="163" fill="#059669" font-family="Fira Code, monospace" font-size="10" text-anchor="middle">Supabase</text>
    

  <line x1="20" y1="188" x2="420" y2="188" stroke="#e1e4e8" stroke-width="1"/>

  <!-- Footer Info -->
  <text x="20" y="208" fill="#57606a" font-family="Fira Code, monospace" font-size="11">🛠️ Dart</text>
  <text x="420" y="208" fill="#57606a" font-family="Fira Code, monospace" font-size="11" text-anchor="end">🐙 GitHub Repository</text>
</svg>