<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="540" height="360">
  <style>
    .user-title { font-family: 'Fira Code', monospace; font-size: 18px; font-weight: 700; }
    .at-glance { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
    .stat-num { font-family: 'Fira Code', monospace; font-size: 24px; font-weight: 700; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; }
    .lang-header { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 700; }
    .lang-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
  </style>

  <!-- Top Stats Container Card -->
  <rect width="540" height="175" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Card Header -->
  <text x="24" y="34" fill="#059669" class="user-title">Saidom0423</text>
  <text x="516" y="34" fill="#57606a" class="at-glance" text-anchor="end">at a glance</text>
  <line x1="24" y1="48" x2="516" y2="48" stroke="#e1e4e8" stroke-width="1"/>

  <!-- Row 1 Stats -->
  <g>
    <text x="24" y="78" fill="#24292e" class="stat-num">1</text>
    <text x="24" y="96" fill="#57606a" class="stat-label">Total stars</text>

    <text x="200" y="78" fill="#24292e" class="stat-num">12</text>
    <text x="200" y="96" fill="#57606a" class="stat-label">Public repos</text>

    <text x="380" y="78" fill="#24292e" class="stat-num">0</text>
    <text x="380" y="96" fill="#57606a" class="stat-label">Followers</text>
  </g>

  <!-- Row 2 Stats -->
  <g>
    <text x="24" y="132" fill="#24292e" class="stat-num">38</text>
    <text x="24" y="150" fill="#57606a" class="stat-label">Contributions (1y)</text>

    <text x="200" y="132" fill="#24292e" class="stat-num">1</text>
    <text x="200" y="150" fill="#57606a" class="stat-label">Current streak</text>

    <text x="380" y="132" fill="#24292e" class="stat-num">2</text>
    <text x="380" y="150" fill="#57606a" class="stat-label">Longest streak</text>
  </g>

  <!-- Bottom Languages Section -->
  <text x="24" y="200" fill="#0969da" class="lang-header">💬 5 Languages</text>
  <text x="270.0" y="218" fill="#0969da" class="lang-sub" text-anchor="middle">Most used languages</text>

  <!-- Multi-color Progress Bar -->
  <g clip-path="url(#bar-clip)">
    <clipPath id="bar-clip">
      <rect x="24" y="230" width="492" height="10" rx="5"/>
    </clipPath>
    <rect x="24" y="230" width="206.64" height="10" fill="#00B4AB" /><rect x="230.64" y="230" width="137.76000000000002" height="10" fill="#F7DF1E" /><rect x="368.4" y="230" width="88.56" height="10" fill="#3572A5" /><rect x="456.96" y="230" width="34.440000000000005" height="10" fill="#7F52FF" /><rect x="491.4" y="230" width="24.6" height="10" fill="#e34c26" />
  </g>

  <!-- 2-Column Languages List -->
  
    <circle cx="28" cy="260" r="4" fill="#00B4AB"/>
    <text x="40" y="264" fill="#24292e" font-family="Fira Code, monospace" font-size="12">Dart</text>
    <text x="145" y="264" fill="#57606a" font-family="Fira Code, monospace" font-size="11">184 kB</text>
    <text x="220" y="264" fill="#57606a" font-family="Fira Code, monospace" font-size="11" font-weight="bold">42.0%</text>
    
    <circle cx="28" cy="282" r="4" fill="#3572A5"/>
    <text x="40" y="286" fill="#24292e" font-family="Fira Code, monospace" font-size="12">Python</text>
    <text x="145" y="286" fill="#57606a" font-family="Fira Code, monospace" font-size="11">17.5 kB</text>
    <text x="220" y="286" fill="#57606a" font-family="Fira Code, monospace" font-size="11" font-weight="bold">18.0%</text>
    
    <circle cx="28" cy="304" r="4" fill="#7F52FF"/>
    <text x="40" y="308" fill="#24292e" font-family="Fira Code, monospace" font-size="12">Kotlin</text>
    <text x="145" y="308" fill="#57606a" font-family="Fira Code, monospace" font-size="11">12.0 kB</text>
    <text x="220" y="308" fill="#57606a" font-family="Fira Code, monospace" font-size="11" font-weight="bold">7.0%</text>
    
  
    <circle cx="288" cy="260" r="4" fill="#F7DF1E"/>
    <text x="300" y="264" fill="#24292e" font-family="Fira Code, monospace" font-size="12">JavaScript</text>
    <text x="405" y="264" fill="#57606a" font-family="Fira Code, monospace" font-size="11">43.0 kB</text>
    <text x="480" y="264" fill="#57606a" font-family="Fira Code, monospace" font-size="11" font-weight="bold">28.0%</text>
    
    <circle cx="288" cy="282" r="4" fill="#e34c26"/>
    <text x="300" y="286" fill="#24292e" font-family="Fira Code, monospace" font-size="12">HTML/CSS</text>
    <text x="405" y="286" fill="#57606a" font-family="Fira Code, monospace" font-size="11">15.0 kB</text>
    <text x="480" y="286" fill="#57606a" font-family="Fira Code, monospace" font-size="11" font-weight="bold">5.0%</text>
    
</svg>