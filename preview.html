<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saidom0423 Profile README Preview</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #10b981;
      --heading: #58a6ff;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --card-bg: #f6f8fa;
      --border: #d0d7de;
      --text: #24292e;
      --accent: #059669;
      --heading: #0969da;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      background-color: var(--card-bg);
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .theme-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-family: monospace;
      cursor: pointer;
      font-weight: bold;
    }

    .section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 20px 0;
    }

    .full-width {
      grid-column: span 2;
    }

    h2 {
      color: var(--heading);
      font-family: monospace;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-top: 32px;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .center {
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <h1 style="font-family: monospace; margin: 0;">Saidom0423 Profile Preview</h1>
      <button class="theme-btn" onclick="toggleTheme()">Toggle Theme (Dark / Light)</button>
    </div>

    <!-- Hero -->
    <div class="center">
      <img id="img-portrait" src="assets/portrait.png" width="340" alt="Portrait">
      <h2 style="border: none;">Sai Dom / Saidom0423</h2>
      <p style="font-family: monospace; color: var(--accent);">Backend-Focused Software Engineer | Django & DRF | Flutter</p>
    </div>

    <!-- Toolbox -->
    <h2>~/ toolbox</h2>
    <div class="center">
      <img src="https://skillicons.dev/icons?i=py,django,js,ts,react,nodejs,express,flutter,dart,kotlin,cpp,postgres,mongodb,supabase,tailwind,html,css,git,github&perline=10" alt="Sai Dom's Tech Toolbox">
    </div>
    <div class="section-grid">
      <div class="center">
        <h3>Engineering Capability</h3>
        <img id="img-radar" src="assets/radar-dark.svg" alt="Engineering Radar">
      </div>
      <div class="center">
        <h3>Repository Language Footprint</h3>
        <img id="img-radar-langs" src="assets/radar-langs-dark.svg" alt="Language Radar">
      </div>
    </div>

    <!-- Contribution Activity -->
    <h2>~/ contribution activity</h2>
    <div class="center">
      <img id="img-snake" src="assets/snake-dark.svg" alt="Contribution Snake" width="100%">
    </div>

    <!-- Stats & Languages -->
    <h2>~/ the numbers</h2>
    <div class="center">
      <img id="img-stats" src="assets/stats-dark.svg" alt="Stats" width="540">
    </div>

    <!-- Project Cards -->
    <h2>~/ selected work</h2>
    <div class="section-grid">
      <div class="center">
        <img id="img-card-grromio" src="assets/cards/grromio-dark.svg" alt="Grromio">
      </div>
      <div class="center">
        <img id="img-card-hyperlink" src="assets/cards/hyperlink-dark.svg" alt="Hyperlink">
      </div>
      <div class="center">
        <img id="img-card-study" src="assets/cards/study-heatmap-dark.svg" alt="Study Heatmap">
      </div>
      <div class="center">
        <img id="img-card-freelance" src="assets/cards/freelance-dark.svg" alt="Freelance Marketplace">
      </div>
    </div>
  </div>

  <script>
    let isDark = true;
    function toggleTheme() {
      isDark = !isDark;
      const html = document.documentElement;
      html.setAttribute('data-theme', isDark ? 'dark' : 'light');

      const mode = isDark ? 'dark' : 'light';
      document.getElementById('img-radar').src = `assets/radar-${mode}.svg`;
      document.getElementById('img-radar-langs').src = `assets/radar-langs-${mode}.svg`;
      document.getElementById('img-stats').src = `assets/stats-${mode}.svg`;
      document.getElementById('img-card-grromio').src = `assets/cards/grromio-${mode}.svg`;
      document.getElementById('img-card-hyperlink').src = `assets/cards/hyperlink-${mode}.svg`;
      document.getElementById('img-card-study').src = `assets/cards/study-heatmap-${mode}.svg`;
      document.getElementById('img-card-freelance').src = `assets/cards/freelance-${mode}.svg`;
    }
  </script>
</body>
</html>
